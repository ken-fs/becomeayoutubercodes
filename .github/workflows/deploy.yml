# Push to main → build → wrangler deploy. Generated by Ship/scripts/setup-gh-deploy.py.
# Stands in for Cloudflare's dashboard-only Git integration. Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          npm ci

      - name: Build
        run: npm run build
        env:
          # Consent-gated GA4 measurement id (repo variable, not a secret).
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_SITE_URL: https://becomeayoutubercodes.wiki

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live deploy marker
        run: |
          for i in 1 2 3 4 5 6; do
            live=$(curl -s "https://becomeayoutubercodes.wiki/.well-known/deploy.txt?ci=$GITHUB_RUN_ID-$i" | tr -d '\n')
            [ "$live" = "$GITHUB_SHA" ] && echo "live = $live" && exit 0
            sleep 10
          done
          echo "live marker '$live' != $GITHUB_SHA"; exit 1
